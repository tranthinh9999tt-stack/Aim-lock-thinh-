
name: Build Aimlock APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip -o "$(find . -maxdepth 1 -name '*.zip' | head -n 1)" -d project
          find project -name gradlew -type f -exec chmod +x {} \;

      - name: Build APK
        run: |
          cd project
          if [ -f gradlew ]; then
            ./gradlew assembleDebug
          else
            echo "Khong tim thay gradlew trong ZIP"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aimlock-APK
          path: project/**/build/outputs/apk/debug/*.apk
          
